<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review extracted deadlines — Planora</title>
<link rel="icon" href="../assets/planora-wordmark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="../css/theme.css?v=20261022a" rel="stylesheet">
<link href="../css/review-source.css?v=20261028b" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<main class="page"><div class="wrap page-body">
  <div class="head-row rvs-head">
    <div><h1 id="rvsHeading">Deadlines extracted</h1><p>Click a deadline to see exactly where Planora found it in your syllabus.</p></div>
  </div>

  <div class="rvs-grid">
    <section class="rvs-source-col" aria-label="Source preview">
      <!-- PDF viewer: reuses the Source evidence modal's .citation-* classes from theme.css -->
      <div class="rvs-viewer">
        <div class="citation-pdf-toolbar">
          <div class="citation-toolbar-file"><span class="citation-pdf-icon" aria-hidden="true">PDF</span>
            <div class="rvs-file-text"><div class="citation-toolbar-name" id="rvsFile"></div><div>Original file you uploaded</div></div></div>
          <div class="citation-toolbar-meta">
            <button type="button" class="rvs-pg" id="rvsPrev" aria-label="Previous page">‹</button>
            <span id="rvsPage" aria-live="polite"></span>
            <button type="button" class="rvs-pg" id="rvsNext" aria-label="Next page">›</button>
            <span class="rvs-zoom">100%</span>
          </div>
        </div>
        <div class="citation-pdf-stage">
          <article class="citation-document" id="rvsPaper" role="region">
            <div class="citation-document-brand" id="rvsBrand"></div>
            <div id="rvsDoc"></div>
            <div class="citation-page-number" id="rvsFoot"></div>
          </article>
        </div>
      </div>
      <div class="rvs-clash" id="rvsClash" hidden></div>
    </section>
    <section aria-label="Extracted deadlines">
      <div class="rvs-list pcard" id="rvsList"></div>
    </section>
  </div>

  <div class="rvs-foot">
    <p class="rvs-note" id="rvsNote" aria-live="polite"></p>
    <div class="d-flex gap-2">
      <a class="btn btn-secondary" href="upload.html" id="rvsCancel">Cancel</a>
      <button type="button" class="btn btn-primary" id="rvsConfirm">Confirm all</button>
    </div>
  </div>
</div></main>

<!-- Edit deadline -->
<div class="modal fade" id="rvsEditModal" tabindex="-1" aria-labelledby="rvsEditTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="rvsEditForm" novalidate>
    <div class="modal-header border-0 pb-0"><h2 class="modal-title fs-4" id="rvsEditTitle">Edit deadline</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label" for="rvsFTitle">Title</label><input class="form-control" id="rvsFTitle" required><div class="invalid-feedback">Give the deadline a title.</div></div>
      <div class="row g-3">
        <div class="col-sm-6"><label class="form-label" for="rvsFDate">Date</label><input class="form-control" type="date" id="rvsFDate" required><div class="invalid-feedback">Pick a date.</div></div>
        <div class="col-sm-6"><label class="form-label" for="rvsFType">Type</label><select class="form-select" id="rvsFType"></select></div>
        <div class="col-sm-6"><label class="form-label" for="rvsFWeight">Weight <span class="opt">(% of final grade)</span></label><input class="form-control" type="number" id="rvsFWeight" min="0" max="100" step="1"><div class="invalid-feedback">Enter a number from 0 to 100.</div></div>
      </div>
    </div>
    <div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save changes</button></div>
  </form></div>
</div>

<!-- Confirm while clashes remain -->
<div class="modal fade" id="rvsClashModal" tabindex="-1" aria-labelledby="rvsClashTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header border-0 pb-0"><h2 class="modal-title fs-4" id="rvsClashTitle">Deadlines still clash</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><p class="mb-0" id="rvsClashMsg"></p></div>
    <div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-secondary" id="rvsResolveNow">Resolve now</button><button type="button" class="btn btn-primary" id="rvsReviewLater">Review later</button></div>
  </div></div>
</div>

<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/config.js?v=20261028d"></script>
<script src="js/store.js?v=20261028d"></script>
<script src="js/app.js?v=20261027a"></script>
<script src="js/review-core.js?v=20261028f"></script>
<script src="js/review.js?v=20261028c"></script>
</body>
</html>
