<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Planora</title>
<link rel="icon" href="../assets/planora-wordmark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="../css/theme.css?v=20261022a" rel="stylesheet">
</head>
<body>
<header class="pl-navbar"><div class="wrap pl-nav pl-nav-center"><a class="brand" href="index.html"><img src="../assets/planora-wordmark.png" alt="Planora"></a></div></header>
<main class="auth-stage"><aside class="auth-art auth-art-left"></aside><div class="auth-card">
  <h1>Welcome back</h1><div class="sub">Log in to see what's due this week.</div>
  <div class="auth-alert" id="err" role="alert" hidden>That email and password don't match an account. Try again, or reset your password.</div>
  <form id="f" novalidate>
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" placeholder="you@school.edu" autocomplete="username"><div class="invalid-feedback">Enter a valid email address.</div></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" placeholder="••••••••" autocomplete="current-password"><div class="invalid-feedback">Enter your password.</div></div>
    <div class="d-flex justify-content-between align-items-center mb-3"><label class="form-check"><input class="form-check-input" type="checkbox" checked> <span class="form-check-label small">Remember me</span></label><a href="#" id="forgot" class="small fw-semibold">Forgot password?</a></div>
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <div class="divider">or</div>
  <button class="btn btn-secondary w-100" id="google" type="button">Continue with Google</button>
  <p class="text-center muted mt-4 mb-0 small">Don't have an account? <a class="fw-semibold" href="signup.html">Sign up free</a></p>
  <p class="text-center faint mt-2 mb-0 small">Prototype: any email works, password is <b>demo1234</b>.</p>
</div><aside class="auth-art auth-art-right"></aside></main>

<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/config.js?v=20261027a"></script>
<script src="js/store.js?v=20261027a"></script>
<script src="js/app.js?v=20261027a"></script>
<script src="js/login.js?v=20261027a"></script>
</body>
</html>
